# Drop-in for josh's podman-auto-update.timer (docs/houses-collector.md). Copy it to
# ~/.config/systemd/user/podman-auto-update.timer.d/ so a new collector image from CI lands within
# about 15 minutes instead of a day. It applies to every container josh runs with AutoUpdate=.
[Timer]
# An empty OnCalendar= clears the stock daily schedule before the new one is added.
OnCalendar=
OnCalendar=*:0/15
RandomizedDelaySec=0
