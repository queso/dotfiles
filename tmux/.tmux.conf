# tmux display in 256 colours
set -g default-terminal "tmux-256color-italic"
set -as terminal-overrides ',xterm*:RGB:sitm=\E[3m'
set -as terminal-features ',tmux-256color-italic:RGB'

# Pass SSH agent through to subprocesses (COLORTERM excluded so set-environment below isn't overwritten)
# Explicitly set the full list to override tmux defaults (which include COLORTERM)
set-option -g update-environment "DISPLAY KRB5CCNAME SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY"

# Ensure truecolor is always available (for apps like Claude Code)
set-environment -g COLORTERM truecolor

# Bind Control key
set -g prefix C-j

# Setup copy/paste (macOS only)
if-shell "uname | grep -q Darwin" "set-option -g default-command 'reattach-to-user-namespace -l zsh'"

# Copy to system clipboard via OSC 52 (works over SSH too)
set -s set-clipboard on
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel

# Use vi key bindings
set -g status-keys vi
setw -g mode-keys vi

# Control+C-a to go to previous window
bind-key C-j last-window

# Move window to the top
bind t swap-window -t 0

# Let us mouse up and down in terminal
set -g mouse on

# Start our panes at 1 instead of 0, like a keyboard.
set -g base-index 1
setw -g pane-base-index 1

bind c new-window -c "#{pane_current_path}"

set-option -g history-limit 10000
# set-option -g mouse-select-pane on

# Session directory mapping - persists session->path for crash recovery
set-hook -g session-created "run-shell '$HOME/.tmux-session-hook.sh upsert #{session_name} #{session_path}'"
set-hook -g session-closed  "run-shell '$HOME/.tmux-session-hook.sh delete #{hook_session_name}'"
set-hook -g session-renamed "run-shell '$HOME/.tmux-session-hook.sh upsert #{session_name} #{session_path}'"

# A(i)-Team: when a 5th pane is created in the current window, break it out
# into its own window so agent lanes stay at ≤4 panes per window
set-hook -g after-split-window 'run-shell "$HOME/.tmux-agent-lanes.sh #{window_id} #{pane_id}"'

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'
set -g @resurrect-processes '"~cyolo->cyolo --continue"'

run '~/.tmux/plugins/tpm/tpm'
